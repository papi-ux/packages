name: Publish

# Builds the Polaris package repositories and serves them at repo.papi-ux.com.
#
# This lives here rather than in papi-ux/polaris for a reason that is not
# stylistic. GitHub reserves <user-domain>/<repo-name> for any repository with
# a Pages site, so enabling Pages on papi-ux/polaris takes over
# papi-ux.com/polaris/ -- which is a real page on the docs site. A custom domain
# does not avoid it; it turns the collision into a 301 to that domain. The only
# fix is publishing from a repository whose name collides with nothing, and
# papi-ux.com/packages/ is unused.
#
# Running here also means no cross-repository credential. Polaris releases are
# public, so the assets need no auth, and Pages deploys with this repository's
# own GITHUB_TOKEN.

on:
  schedule:
    # Hourly. The lag does matter -- the Update Center offers `dnf upgrade
    # polaris` the moment a release appears on GitHub, and until this catches up
    # that command correctly does nothing, which reads as the feature being
    # broken rather than the repository being behind.
    #
    # But every fifteen minutes is 96 runs a day, and an Actions tab that is a
    # wall of green checkmarks is one where a real failure goes unnoticed.
    # Releases land a few times a week, so the difference is usually invisible,
    # and a release worth having immediately can be dispatched by hand.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Polaris release tag to publish (blank uses the latest release)'
        required: false
        type: string
      approved_sha:
        description: 'Exact approved Polaris merge SHA (required for an explicit tag)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A dispatch landing during a scheduled run would race two deploys at one
  # Pages site. Queue rather than cancel: the run already assembling packages
  # is doing real work, and the one behind it re-checks PUBLISHED_TAG anyway.
  group: publish
  cancel-in-progress: false

env:
  POLARIS_REPO: papi-ux/polaris

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      release_sha: ${{ steps.pick.outputs.release_sha }}
      published: ${{ steps.pick.outputs.published }}
      ready: ${{ steps.pick.outputs.ready }}

    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            # An explicit tag is taken as given: republishing a specific release
            # is the reason this input exists.
            tag="$REQUESTED_TAG"
          else
            # releases/latest excludes drafts and prereleases by definition.
            # `gh release view` with no tag does not promise that, and Polaris
            # ships prereleases its own Update Center only offers behind an
            # opt-in -- one must never become the stable repository's content
            # because a scheduled run happened to see it first.
            tag="$(gh api "repos/$POLARIS_REPO/releases/latest" --jq .tag_name)"
          fi
          [ -n "$tag" ] || { echo 'could not resolve a release tag' >&2; exit 1; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "$tag is not a stable semantic-version tag" >&2
            exit 1
          }

          release_json="$(gh api "repos/$POLARIS_REPO/releases/tags/$tag")"
          [ "$(jq -r .draft <<< "$release_json")" = false ] || {
            echo "$tag is still a draft" >&2
            exit 1
          }
          [ "$(jq -r .prerelease <<< "$release_json")" = false ] || {
            echo "$tag is a prerelease; stable repositories reject prereleases before assembly" >&2
            exit 1
          }

          # The scheduled run exists to notice a new release, so it should do
          # nothing at all when there is not one. Comparing against what is
          # already published keeps six deploys a day from being six rewrites
          # of an identical tree.
          published="$(curl -fsS --max-time 20 https://repo.papi-ux.com/PUBLISHED_TAG 2>/dev/null || echo '')"

          # A release exists before its assets do. Polaris creates the release
          # first -- deliberately, so the workflow that uploads packages finds
          # real notes rather than writing a placeholder -- and the builds take
          # another twenty minutes. A run landing in that window would resolve
          # the new tag and then fail downloading a package that is not there
          # yet, which is a red run for something that is merely early.
          assets="$(gh release view "$tag" --repo "$POLARIS_REPO" --json assets --jq '[.assets[].name] | join(" ")')"
          release_sha="$(gh api "repos/$POLARIS_REPO/commits/$tag" --jq .sha)"
          [ -n "$release_sha" ] || { echo "could not resolve source commit for $tag" >&2; exit 1; }
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [[ "$APPROVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo 'manual publication requires approved_sha as a full commit SHA' >&2
              exit 1
            }
            approved_sha="$(printf '%s' "$APPROVED_SHA" | tr '[:upper:]' '[:lower:]')"
            [ "$release_sha" = "$approved_sha" ] || {
              echo "tag source $release_sha does not match approved SHA $approved_sha" >&2
              exit 1
            }
          fi
          # polaris-kms arrived in 1.4.13, when the DRM/KMS capture capability moved
          # out of the binary and into a package of its own. Releases before that
          # legitimately have no KMS packages, so demanding them unconditionally
          # would report a finished release as "not ready" forever, which reads as
          # a stalled upload rather than a version that predates the split, and
          # would turn a hand-requested republication of an older tag into a
          # failure for a reason that is not true.
          required_assets=(Polaris-fedora44-x86_64.rpm Polaris-arch-x86_64.pkg.tar.zst)
          if [ "$(printf '%s\n%s\n' 1.4.13 "${tag#v}" | sort -V | head -1)" = 1.4.13 ]; then
            required_assets+=(Polaris-kms-fedora44-x86_64.rpm Polaris-kms-arch-x86_64.pkg.tar.zst)
          fi
          ready=true
          for required in "${required_assets[@]}"; do
            case " $assets " in
              *" $required "*) ;;
              *) ready=false; echo "not ready: $tag has no $required yet" ;;
            esac
          done

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "release_sha=$release_sha"
            echo "published=$published"
            echo "ready=$ready"
          } >> "$GITHUB_OUTPUT"
          echo "resolved $tag (currently published: ${published:-none}, assets ready: $ready)"

          # Asked for by hand and not ready is worth a failure: someone is
          # waiting on it, and a silent skip looks like it worked.
          if [ "$ready" != true ] && [ -n "$REQUESTED_TAG" ]; then
            echo "$tag does not have its release assets yet" >&2
            exit 1
          fi

  fedora-repo:
    name: Assemble dnf repository
    needs: resolve
    if: ${{ needs.resolve.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || needs.resolve.outputs.tag != needs.resolve.outputs.published) }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:44

    steps:
      - name: Install repository tools
        run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 git tar gh python3

      - uses: actions/checkout@v7

      - name: Download the release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ needs.resolve.outputs.tag }}" --repo "$POLARIS_REPO" \
            --pattern 'Polaris-fedora44-x86_64.rpm' --dir assets
          if [ "$(printf '%s\n%s\n' 1.4.13 "${{ needs.resolve.outputs.version }}" | sort -V | head -1)" = 1.4.13 ]; then
            gh release download "${{ needs.resolve.outputs.tag }}" --repo "$POLARIS_REPO" \
              --pattern 'Polaris-kms-fedora44-x86_64.rpm' --dir assets
          fi

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.POLARIS_REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo 'POLARIS_REPO_GPG_PRIVATE_KEY is not set. A published repository must be signed.' >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Assemble the repository
        run: |
          bash scripts/build-package-repos.sh --only fedora \
            --assets assets --version "${{ needs.resolve.outputs.version }}" --output repo \
            --release-tag "${{ needs.resolve.outputs.tag }}" \
            --release-sha "${{ needs.resolve.outputs.release_sha }}" \
            --gpg-key-id "${{ secrets.POLARIS_REPO_GPG_KEY_ID }}"

      - uses: actions/upload-artifact@v7
        with:
          name: repo-fedora
          path: repo/
          if-no-files-found: error

  arch-repo:
    name: Assemble pacman repository
    needs: resolve
    if: ${{ needs.resolve.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || needs.resolve.outputs.tag != needs.resolve.outputs.published) }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest

    steps:
      - name: Bootstrap Arch container
        run: pacman -Syu --noconfirm --needed archlinux-keyring git gnupg github-cli tar

      - uses: actions/checkout@v7

      - name: Download the release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ needs.resolve.outputs.tag }}" --repo "$POLARIS_REPO" \
            --pattern 'Polaris-arch-x86_64.pkg.tar.zst' --dir assets
          if [ "$(printf '%s\n%s\n' 1.4.13 "${{ needs.resolve.outputs.version }}" | sort -V | head -1)" = 1.4.13 ]; then
            gh release download "${{ needs.resolve.outputs.tag }}" --repo "$POLARIS_REPO" \
              --pattern 'Polaris-kms-arch-x86_64.pkg.tar.zst' --dir assets
          fi

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.POLARIS_REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo 'POLARIS_REPO_GPG_PRIVATE_KEY is not set. A published repository must be signed.' >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Assemble the repository
        run: |
          bash scripts/build-package-repos.sh --only arch \
            --assets assets --version "${{ needs.resolve.outputs.version }}" --output repo \
            --release-tag "${{ needs.resolve.outputs.tag }}" \
            --release-sha "${{ needs.resolve.outputs.release_sha }}" \
            --gpg-key-id "${{ secrets.POLARIS_REPO_GPG_KEY_ID }}"

      - uses: actions/upload-artifact@v7
        with:
          name: repo-arch
          path: repo/
          if-no-files-found: error

  publish:
    name: Publish to GitHub Pages
    needs:
      - resolve
      - fedora-repo
      - arch-repo
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repo-fedora
          path: site

      - uses: actions/download-artifact@v8
        with:
          name: repo-arch
          path: site

      - name: Check the combined tree
        run: |
          # Both jobs export the public key to the same path, so the merge is
          # only safe if they agree. A mismatch means the two repositories were
          # signed by different keys, which no client could resolve.
          echo 'repo.papi-ux.com' > site/CNAME
          printf '%s' "${{ needs.resolve.outputs.tag }}" > site/PUBLISHED_TAG

          # Without this the bare hostname serves GitHub's "there isn't a
          # GitHub Pages site here" page, because the repository publishes
          # polaris.gpg, fedora/ and arch/ and nothing at the root. That page
          # reads as a broken deploy rather than a missing index, which is
          # exactly how it was first misread.
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Polaris package repository</title>
          <style>
            :root { color-scheme: dark light; }
            body {
              margin: 0 auto; padding: 2.5rem 1.25rem; max-width: 48rem;
              font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
              background: #0b1017; color: #d7dee8;
            }
            h1 { font-size: 1.5rem; margin: 0 0 .25rem; color: #f2f6fb; }
            h2 { font-size: 1rem; margin: 2rem 0 .5rem; color: #f2f6fb; }
            p { color: #9fb0c4; }
            a { color: #6fd3e7; }
            code, pre { font-family: ui-monospace, SFMono-Regular, monospace; }
            pre {
              overflow-x: auto; padding: .9rem 1rem; border-radius: .5rem;
              border: 1px solid #22303f; background: #101823; font-size: .85rem;
            }
            .tag {
              display: inline-block; padding: .15rem .5rem; border-radius: .3rem;
              border: 1px solid #22303f; background: #101823; font-size: .8rem;
            }
            @media (prefers-color-scheme: light) {
              body { background: #fbfcfd; color: #1e2933; }
              h1, h2 { color: #0b1017; }
              p { color: #4a5a6b; }
              pre, .tag { background: #f1f4f7; border-color: #dbe2ea; }
              a { color: #0a6d80; }
            }
          </style>
          </head>
          <body>
          <h1>Polaris package repository</h1>
          <p>
            Signed dnf and pacman repositories for
            <a href="https://github.com/papi-ux/polaris">Polaris</a>.
            Currently serving <span class="tag">${{ needs.resolve.outputs.tag }}</span>.
          </p>

          <h2>Fedora and Bazzite</h2>
          <pre>sudo rpm --import https://repo.papi-ux.com/polaris.gpg
          sudo curl --location --output /etc/yum.repos.d/polaris.repo \\
            https://repo.papi-ux.com/fedora/polaris.repo
          sudo dnf install polaris</pre>

          <h2>Arch and CachyOS</h2>
          <pre>curl -fsSL https://repo.papi-ux.com/polaris.gpg | sudo pacman-key --add -
          sudo pacman-key --lsign-key ${{ secrets.POLARIS_REPO_GPG_KEY_ID }}
          curl -fsSL https://repo.papi-ux.com/arch/polaris.conf | sudo tee -a /etc/pacman.conf
          sudo pacman -Sy polaris</pre>

          <p>
            Full setup, including ostree hosts, is in
            <a href="https://github.com/papi-ux/polaris/blob/master/docs/repositories.md">the Polaris docs</a>.
            After installing, run <code>sudo -H polaris --setup-host</code> once.
          </p>
          </body>
          </html>
          HTML
          # The heredoc is indented to sit inside the YAML block, so strip it.
          sed -i 's/^          //' site/index.html

          for required in \
            CNAME \
            PUBLISHED_TAG \
            index.html \
            polaris.gpg \
            fedora/polaris.repo \
            fedora/x86_64/repodata/repomd.xml \
            fedora/x86_64/repodata/repomd.xml.asc \
            fedora/x86_64/Polaris-fedora44-x86_64.rpm.provenance.json \
            fedora/x86_64/Polaris-fedora44-x86_64.rpm.provenance.json.asc \
            arch/polaris.conf \
            arch/x86_64/polaris.db \
            arch/x86_64/polaris.db.sig
          do
            if [ ! -f "site/$required" ]; then
              echo "missing from the published tree: $required" >&2
              exit 1
            fi
          done

          # Since 1.4.13 the KMS package is published beside the base one, and a
          # tree carrying only half of that pair is a dependency nothing can
          # satisfy: polaris-kms pins "polaris = <exact version>". Older tags
          # predate the split and are republishable without it.
          if [ "$(printf '%s\n%s\n' 1.4.13 "${{ needs.resolve.outputs.version }}" | sort -V | head -1)" = 1.4.13 ]; then
            for required in \
              fedora/x86_64/Polaris-kms-fedora44-x86_64.rpm.provenance.json \
              fedora/x86_64/Polaris-kms-fedora44-x86_64.rpm.provenance.json.asc
            do
              if [ ! -f "site/$required" ]; then
                echo "missing from the published tree: $required" >&2
                exit 1
              fi
            done
          fi

          if find site -type l | grep -q .; then
            echo 'the published tree contains a symlink; a static host serves it as text' >&2
            find site -type l >&2
            exit 1
          fi

          echo 'Publishing:'
          find site -type f | sort | sed 's/^/  /'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Check the docs site is unaffected
        # This repository is named `packages`, so GitHub reserves
        # papi-ux.com/packages/ for it -- a path the docs site does not use.
        # Enabling Pages on papi-ux/polaris instead took over
        # papi-ux.com/polaris/, which is a real page. This asserts the reason
        # this repository exists still holds.
        run: |
          for route in /polaris/ /nova/ /compare/ /docs/; do
            for attempt in 1 2 3; do
              status="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 \
                "https://papi-ux.com${route}?deploy-check=$GITHUB_RUN_ID-$attempt" || echo 000)"
              [ "$status" = '200' ] && break
              sleep 15
            done
            if [ "$status" != '200' ]; then
              echo "papi-ux.com${route} returned $status after this deploy" >&2
              exit 1
            fi
            echo "papi-ux.com${route} 200"
          done

  verify-fedora-public:
    name: Verify public dnf repository
    needs:
      - resolve
      - publish
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - name: Install verification tools
        run: dnf install -y --setopt=install_weak_deps=False rpm gnupg2 git gh zstd jq python3
      - uses: actions/checkout@v7
      - name: Read back the deployed repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/verify-public-repository.sh --only fedora \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --release-sha "${{ needs.resolve.outputs.release_sha }}" \
            --expected-fingerprint "${{ secrets.POLARIS_REPO_GPG_KEY_ID }}"

  verify-arch-public:
    name: Verify public pacman repository
    needs:
      - resolve
      - publish
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Install verification tools
        run: pacman -Syu --noconfirm --needed archlinux-keyring git gnupg github-cli libarchive jq
      - uses: actions/checkout@v7
      - name: Read back the deployed repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/verify-public-repository.sh --only arch \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --release-sha "${{ needs.resolve.outputs.release_sha }}" \
            --expected-fingerprint "${{ secrets.POLARIS_REPO_GPG_KEY_ID }}"

  verify-public-routes:
    name: Verify unaffected public routes
    needs:
      - resolve
      - publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Read back the deployment marker and docs routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/verify-public-repository.sh --only routes \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --expected-fingerprint "${{ secrets.POLARIS_REPO_GPG_KEY_ID }}"
